# 使用方法（二选一）：
#
# 方式 A —— 本机或自己的服务器：
#   把本文件复制一份，改名为 secrets.toml（去掉 .example），
#   然后把下面引号里换成你自己的密码。
#   secrets.toml 已被 .gitignore 排除，不会被提交到 GitHub。
#
# 方式 B —— Streamlit 官方云：
#   不需要这个文件。到云端后台
#   「你的应用 -> Settings(三个点) -> Settings -> Secrets」
#   里粘贴下面这一行（换成你的密码），保存后应用会自动重启生效。
#
access_password = "在这里填一个只有你知道的密码"
